<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>مقايضة</title>
<style>
:root{--p:#0f766e;--pd:#115e59;--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{background:var(--p);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}
header button{background:transparent;border:0;color:#fff;font-size:14px}
main{padding:12px;max-width:700px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:var(--mu);position:relative}
.dot{position:absolute;top:4px;left:calc(50% + 6px);background:#dc2626;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-style:normal;display:none;align-items:center;justify-content:center;padding:0 5px}
nav button.on{color:var(--p);font-weight:700}
nav button span{display:block;font-size:20px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;margin-bottom:10px}
textarea{min-height:80px}
.btn{display:block;width:100%;background:var(--p);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;margin-bottom:8px}
.btn.sec{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn.red{background:#fff;color:#b91c1c;border:1px solid #b91c1c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.card img{width:100%;height:120px;object-fit:cover;display:block;background:#e5e7eb}
.card .t{padding:8px}
.card h3{margin:0 0 4px;font-size:14px}
.mu{color:var(--mu);font-size:12px}
.want{background:#ecfdf5;color:var(--pd);border-radius:8px;padding:8px;margin:8px 0;font-size:14px}
.big{width:100%;max-height:300px;object-fit:cover;border-radius:12px}
.row{display:flex;gap:8px}
.chat{display:flex;flex-direction:column;height:calc(100vh - 260px);height:calc(100dvh - 205px);min-height:200px}
.msgs{flex:1;overflow-y:auto;padding:6px}
.m{max-width:78%;padding:8px 12px;border-radius:14px;margin:4px 0;font-size:15px;word-wrap:break-word}
.m.me{background:var(--p);color:#fff;margin-right:auto;margin-left:0;border-bottom-left-radius:4px}
.m.ot{background:#fff;border:1px solid var(--bd);margin-left:auto;margin-right:0;border-bottom-right-radius:4px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.login{text-align:center;padding:60px 20px}
.login h2{font-size:30px;color:var(--p)}
.li{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:9}
</style>
</head>
<body>
<header><h1>🔄 مقايضة <small style="font-size:10px;opacity:.6">v3</small></h1><button id="out" style="display:none">خروج</button></header>
<div id="toast"></div>
<main id="view"></main>
<nav id="nav" style="display:none">
<button data-v="home" class="on"><span>🏠</span>الرئيسية</button>
<button data-v="add"><span>➕</span>أضف عرض</button>
<button data-v="mine"><span>📦</span>عروضي</button>
<button data-v="chats"><span>💬</span>الرسائل<i class="dot" id="bd"></i></button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,setDoc,getDoc,getDocs,deleteDoc,updateDoc,query,where,orderBy,limit,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCT5Fz2LUVXfXxVz8tiEPVkMZ4YVLielwM",
  authDomain: "moqayda-3de15.firebaseapp.com",
  projectId: "moqayda-3de15",
  storageBucket: "moqayda-3de15.firebasestorage.app",
  messagingSenderId: "680827846796",
  appId: "1:680827846796:web:8217e450875b9e84dc3ba9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const CATS = ["إلكترونيات","موبايلات","ملابس","أثاث","كتب","أجهزة منزلية","سيارات وموتوسيكلات","ألعاب","خدمات","أخرى"];
const GOVS = ["القاهرة","الجيزة","الإسكندرية","الدقهلية","الشرقية","الغربية","المنوفية","القليوبية","البحيرة","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","الفيوم","بني سويف","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","مطروح","البحر الأحمر","شمال سيناء","جنوب سيناء","الوادي الجديد"];

const $ = s => document.querySelector(s);
const view = $("#view");
let me = null, unsub = null, allOffers = [], photo = "", curView = "", unsubBadge = null, lastUnread = 0;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts = (arr, ph) => `<option value="">${ph}</option>` + arr.map(a => `<option>${a}</option>`).join("");
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}
function stopChat(){if(unsub){unsub();unsub=null}}
function isUnread(c){
  if(!me || !c.lastFrom || c.lastFrom === me.uid || !c.lastAt) return false;
  const r = c.reads && c.reads[me.uid];
  return !r || r.seconds < c.lastAt.seconds;
}
function setBadge(n){
  const b = $("#bd"); if(!b) return;
  b.style.display = n ? "flex" : "none"; b.textContent = n > 9 ? "9+" : n;
  document.title = n ? "(" + n + ") مقايضة" : "مقايضة";
  try{ n ? navigator.setAppBadge && navigator.setAppBadge(n) : navigator.clearAppBadge && navigator.clearAppBadge(); }catch{}
}
function markRead(cid){
  updateDoc(doc(db,"chats",cid), {["reads."+me.uid]: serverTimestamp()}).catch(()=>{});
}
function watchUnread(){
  if(unsubBadge){ unsubBadge(); unsubBadge = null; }
  lastUnread = 0; setBadge(0);
  if(!me) return;
  let first = true;
  unsubBadge = onSnapshot(query(collection(db,"chats"), where("participants","array-contains",me.uid)), s => {
    const n = s.docs.filter(d => isUnread(d.data())).length;
    setBadge(n);
    if(!first && n > lastUnread && curView !== "chat") toast("📩 رسالة جديدة");
    lastUnread = n; first = false;
    if(curView === "chats") chatsView();
  }, () => {});
}

/* ---------- Auth ---------- */
$("#out").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  me = u;
  $("#out").style.display = u ? "" : "none";
  $("#nav").style.display = u ? "flex" : "none";
  watchUnread();
  u ? go("home") : loginView();
});
function loginView(){
  view.innerHTML = `<div class="login"><h2>🔄 مقايضة</h2><p class="mu">بدّل اللي مش محتاجه بحاجة محتاجها</p>
  <button class="btn" id="g">دخول بحساب جوجل</button></div>`;
  $("#g").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ toast("تعذر الدخول: " + (e.code || e.message)); }
  };
}

/* ---------- Router ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.v));
function go(v, arg){
  stopChat();
  curView = v;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  ({home:homeView, add:addView, mine:mineView, chats:chatsView, offer:offerView, chat:chatView})[v](arg);
  scrollTo(0,0);
}

/* ---------- Home ---------- */
async function homeView(){
  view.innerHTML = `<input id="q" placeholder="🔍 ابحث عن حاجة...">
  <div class="row"><select id="fc">${opts(CATS,"كل الفئات")}</select><select id="fg">${opts(GOVS,"كل المحافظات")}</select></div>
  <div id="list" class="grid"></div>`;
  ["q","fc","fg"].forEach(i => $("#"+i).oninput = renderList);
  $("#list").innerHTML = `<div class="empty" style="grid-column:1/-1">جاري التحميل...</div>`;
  try{
    const s = await getDocs(query(collection(db,"offers"), orderBy("createdAt","desc"), limit(100)));
    allOffers = s.docs.map(d => ({id:d.id, ...d.data()})).filter(o => o.status !== "done");
  }catch(e){ allOffers = []; toast("خطأ في التحميل: " + (e.code||e.message)); }
  renderList();
}
function cardHTML(o){
  return `<div class="card" data-id="${o.id}">${o.photo?`<img src="${o.photo}">`:`<img>`}
  <div class="t"><h3>${esc(o.title)}</h3><div class="mu">📍 ${esc(o.gov)} · ${esc(o.cat)}</div>
  <div class="want">🔄 ${esc(o.want)}</div></div></div>`;
}
function renderList(){
  const q = $("#q").value.trim().toLowerCase(), c = $("#fc").value, g = $("#fg").value;
  const r = allOffers.filter(o => (!c || o.cat===c) && (!g || o.gov===g) &&
    (!q || (o.title+" "+o.desc+" "+o.want).toLowerCase().includes(q)));
  const l = $("#list");
  l.innerHTML = r.length ? r.map(cardHTML).join("") : `<div class="empty" style="grid-column:1/-1">مفيش عروض مطابقة</div>`;
  l.querySelectorAll(".card").forEach(e => e.onclick = () => go("offer", e.dataset.id));
}

/* ---------- Add offer ---------- */
function addView(){
  photo = "";
  view.innerHTML = `<h3>عرض جديد</h3>
  <input type="file" id="ph" accept="image/*">
  <img id="pv" class="big" style="display:none;margin-bottom:10px">
  <input id="t" placeholder="اسم الحاجة اللي عندك" maxlength="60">
  <textarea id="d" placeholder="وصف (الحالة، العمر، العيوب...)" maxlength="500"></textarea>
  <input id="w" placeholder="عاوز تقايضها بإيه؟" maxlength="100">
  <select id="c">${opts(CATS,"اختر الفئة")}</select>
  <select id="g">${opts(GOVS,"اختر المحافظة")}</select>
  <button class="btn" id="s">نشر العرض</button>`;
  $("#ph").onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    photo = await compress(f);
    $("#pv").src = photo; $("#pv").style.display = "block";
  };
  $("#s").onclick = async () => {
    const o = {title:$("#t").value.trim(), desc:$("#d").value.trim(), want:$("#w").value.trim(), cat:$("#c").value, gov:$("#g").value};
    if(!o.title || !o.want || !o.cat || !o.gov) return toast("كمّل الاسم وعاوز إيه والفئة والمحافظة");
    if(!photo) return toast("ضيف صورة");
    $("#s").disabled = true;
    try{
      await addDoc(collection(db,"offers"), {...o, photo, status:"open", ownerUid:me.uid, ownerName:me.displayName||"مستخدم", createdAt:serverTimestamp()});
      toast("تم نشر العرض ✅"); go("mine");
    }catch(e){ toast("فشل النشر: "+(e.code||e.message)); $("#s").disabled = false; }
  };
}
function compress(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const m = 640, k = Math.min(1, m/Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = img.width*k; cv.height = img.height*k;
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",0.6));
    };
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- My offers ---------- */
async function mineView(){
  view.innerHTML = `<h3>عروضي</h3><div id="list" class="grid"><div class="empty" style="grid-column:1/-1">جاري التحميل...</div></div>`;
  try{
    const s = await getDocs(query(collection(db,"offers"), where("ownerUid","==",me.uid)));
    const r = s.docs.map(d => ({id:d.id, ...d.data()}));
    const l = $("#list");
    l.innerHTML = r.length ? r.map(o => cardHTML(o).replace('<h3>', o.status==="done"?'<h3>✅ ':'<h3>')).join("") : `<div class="empty" style="grid-column:1/-1">لسه معندكش عروض</div>`;
    l.querySelectorAll(".card").forEach(e => e.onclick = () => go("offer", e.dataset.id));
  }catch(e){ toast("خطأ: "+(e.code||e.message)); }
}

/* ---------- Offer details ---------- */
async function offerView(id){
  view.innerHTML = `<div class="empty">جاري التحميل...</div>`;
  const s = await getDoc(doc(db,"offers",id));
  if(!s.exists()){ view.innerHTML = `<div class="empty">العرض مش موجود</div>`; return; }
  const o = {id, ...s.data()}, mine = o.ownerUid === me.uid;
  const rating = await getRating(o.ownerUid);
  view.innerHTML = `${o.photo?`<img class="big" src="${o.photo}">`:""}
  <h2>${esc(o.title)}</h2>
  <div class="mu">📍 ${esc(o.gov)} · ${esc(o.cat)}</div>
  <p>${esc(o.desc)||"—"}</p>
  <div class="want">🔄 عاوز يقايض بـ: <b>${esc(o.want)}</b></div>
  <p class="mu">صاحب العرض: ${esc(o.ownerName)} ${rating}</p>
  ${mine ? `${o.status!=="done"?`<button class="btn" id="dn">تمت المقايضة ✅</button>`:""}<button class="btn red" id="del">حذف العرض</button>`
         : `<button class="btn" id="pr">🔄 اقترح مقايضة</button><button class="btn red" id="rp">🚩 إبلاغ</button>`}
  <p class="mu">⚠️ قابل الطرف التاني في مكان عام، ولا تدفع فلوس مقدماً.</p>`;
  if(mine){
    if($("#dn")) $("#dn").onclick = async () => { await updateDoc(doc(db,"offers",id),{status:"done"}); toast("تم"); go("mine"); };
    $("#del").onclick = async () => { if(confirm("متأكد من الحذف؟")){ await deleteDoc(doc(db,"offers",id)); go("mine"); } };
  }else{
    $("#pr").onclick = async () => {
      const cid = id + "_" + me.uid;
      await setDoc(doc(db,"chats",cid), {offerId:id, offerTitle:o.title, participants:[o.ownerUid, me.uid],
        names:{[o.ownerUid]:o.ownerName, [me.uid]:me.displayName||"مستخدم"}}, {merge:true});
      go("chat", cid);
    };
    $("#rp").onclick = async () => {
      const r = prompt("سبب الإبلاغ؟"); if(!r) return;
      await addDoc(collection(db,"reports"), {offerId:id, ownerUid:o.ownerUid, reporterUid:me.uid, reason:r, at:serverTimestamp()});
      toast("تم الإبلاغ، شكراً");
    };
  }
}
async function getRating(uid){
  try{
    const s = await getDocs(query(collection(db,"ratings"), where("ratedUid","==",uid)));
    if(s.empty) return "· لا تقييمات بعد";
    const a = s.docs.map(d => d.data().stars);
    return `· ⭐ ${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1)} (${a.length})`;
  }catch{ return ""; }
}

/* ---------- Chats ---------- */
async function chatsView(){
  view.innerHTML = `<h3>الرسائل</h3><div id="list"><div class="empty">جاري التحميل...</div></div>`;
  try{
    const s = await getDocs(query(collection(db,"chats"), where("participants","array-contains",me.uid)));
    const r = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.lastAt?.seconds||0)-(a.lastAt?.seconds||0));
    $("#list").innerHTML = r.length ? r.map(c => {
      const other = c.participants.find(p => p!==me.uid);
      const un = isUnread(c);
      return `<div class="li" data-id="${c.id}" style="${un?"border-color:#dc2626;background:#fef2f2":""}"><b>${un?"🔴 ":""}${esc(c.names?.[other]||"مستخدم")}</b><div class="mu">${esc(c.offerTitle)}</div><div>${esc(c.lastMsg||"")}</div></div>`;
    }).join("") : `<div class="empty">مفيش محادثات</div>`;
    document.querySelectorAll(".li").forEach(e => e.onclick = () => go("chat", e.dataset.id));
  }catch(e){ toast("خطأ: "+(e.code||e.message)); }
}
async function chatView(cid){
  const cs = await getDoc(doc(db,"chats",cid));
  const c = cs.data(), other = c.participants.find(p => p!==me.uid);
  if(isUnread(c)) markRead(cid);
  view.innerHTML = `<div class="row" style="align-items:center;justify-content:space-between"><b>${esc(c.names?.[other]||"مستخدم")} · ${esc(c.offerTitle)}</b><button class="btn sec" id="rt" style="width:auto;padding:6px 10px;margin:0">⭐ قيّم</button></div>
  <div class="chat"><div class="msgs" id="ms"></div>
  <div class="row"><input id="mi" placeholder="اكتب رسالة..." style="margin:0"><button class="btn" id="sd" style="width:auto;margin:0">إرسال</button></div></div>`;
  unsub = onSnapshot(query(collection(db,"chats",cid,"messages"), orderBy("at")), s => {
    const box = $("#ms"); if(!box) return;
    box.innerHTML = s.docs.map(d => { const m = d.data(); return `<div class="m ${m.from===me.uid?"me":"ot"}">${esc(m.text)}</div>`; }).join("");
    box.scrollTop = box.scrollHeight;
    const last = s.docs[s.docs.length-1]?.data();
    if(last && last.from !== me.uid && !s.metadata.hasPendingWrites) markRead(cid);
  });
  const send = async () => {
    const t = $("#mi").value.trim(); if(!t) return; $("#mi").value = "";
    await addDoc(collection(db,"chats",cid,"messages"), {text:t, from:me.uid, at:serverTimestamp()});
    await updateDoc(doc(db,"chats",cid), {lastMsg:t, lastAt:serverTimestamp(), lastFrom:me.uid});
  };
  $("#sd").onclick = send;
  $("#mi").onkeydown = e => { if(e.key==="Enter") send(); };
  $("#rt").onclick = async () => {
    const v = parseInt(prompt("قيّم الطرف التاني من 1 إلى 5"));
    if(!(v>=1 && v<=5)) return;
    try{
      await setDoc(doc(db,"ratings",cid+"_"+me.uid), {ratedUid:other, raterUid:me.uid, stars:v, chatId:cid, at:serverTimestamp()});
      toast("تم التقييم ⭐");
    }catch{ toast("قيّمت المحادثة دي قبل كده"); }
  };
}

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
