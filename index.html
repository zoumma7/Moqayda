<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b5d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>مقايضة</title>
<style>
:root{--p:#0b6b5d;--p2:#12997f;--pt:#0b6b5d;--g:#e0a526;--bg:#f3f5f7;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e4e9ee;--sh:0 8px 24px rgba(15,23,42,.08);--hh:58px;--soft:#e7f4f0;--ok:#16a34a;--no:#dc2626}
html[data-theme=dark]{--bg:#0a1110;--cd:#121c1a;--tx:#e8f0ee;--mu:#8fa39e;--bd:#1f2e2b;--sh:0 8px 24px rgba(0,0,0,.45);--soft:#10312b;--pt:#3fd6b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-top:var(--hh);padding-bottom:92px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.nonav{padding-bottom:20px}body.nonav nav{display:none}
body.login{padding:0}body.login header,body.login nav{display:none}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:currentColor}
.gold{color:var(--g)}.gold svg{width:16px;height:16px;vertical-align:-3px}
header{position:fixed;top:0;left:0;right:0;height:var(--hh);padding:0 10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;gap:10px;z-index:10;box-shadow:0 4px 18px rgba(11,107,93,.35)}
.ib{width:42px;height:42px;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:14px;display:grid;place-items:center;cursor:pointer}
.ttl{flex:1;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--p);display:grid;place-items:center}
main{padding:14px;max-width:720px;margin:auto}
h2,h3{margin:0 0 8px}
.mu{color:var(--mu)}.sm{font-size:12.5px}.ctr{text-align:center}
.pad{padding:16px}
.card{background:var(--cd);border-radius:18px;box-shadow:var(--sh);border:1px solid var(--bd);overflow:hidden}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.offer{cursor:pointer;position:relative;transition:transform .15s}
.offer:active{transform:scale(.98)}
.ph{position:relative;aspect-ratio:1/1;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.fav{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#64748b;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.fav.on{color:#e11d48}.fav.on svg{fill:currentColor}
.badge{position:absolute;top:8px;right:8px;background:var(--ok);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.badge.done{background:#475569}.badge.cond{background:rgba(15,23,42,.72)}
.ct{padding:10px 11px 12px}
.ct h3{font-size:14.5px;margin:0 0 5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.loc{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mu)}.loc svg{width:14px;height:14px}
.want{display:flex;gap:6px;align-items:flex-start;background:var(--soft);color:var(--pt);border-radius:11px;padding:7px 9px;margin:8px 0;font-size:12.5px;font-weight:600;line-height:1.4}
.want svg{width:15px;height:15px;margin-top:2px}
.own{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mu)}
.av{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:inline-grid;place-items:center;font-weight:800;flex:none}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .hi{font-size:20px;font-weight:800}.hero .sub{opacity:.9;font-size:13.5px;margin-top:2px}
.sr{display:flex;align-items:center;gap:8px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:0 14px;box-shadow:var(--sh);margin-bottom:12px;color:var(--mu)}
.sr input{flex:1;border:0;background:none;padding:13px 0;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--cd);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--mu)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.row2{display:flex;gap:10px;align-items:center}.row2>*{flex:1}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--cd);outline:0;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p2)}
textarea{min-height:90px;resize:vertical}
.fld{margin-bottom:12px;text-align:right}.fld>label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:15px;padding:13px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;margin-bottom:10px;cursor:pointer;box-shadow:0 6px 16px rgba(11,107,93,.28)}
.btn.sec{background:var(--cd);color:var(--pt);border:1.5px solid var(--p2);box-shadow:none}
.btn.red{background:var(--cd);color:var(--no);border:1.5px solid var(--no);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,var(--g),#f0c04a);color:#3b2a00;box-shadow:0 6px 16px rgba(224,165,38,.35)}
.btn.sm{width:auto;padding:11px 14px;margin:0;flex:none}
.btn:disabled{opacity:.55}
.empty{text-align:center;color:var(--mu);padding:40px 10px;grid-column:1/-1}.empty svg{width:48px;height:48px;opacity:.4;margin-bottom:8px}
.sk{height:250px;background:linear-gradient(90deg,var(--soft),var(--bd),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -6px 20px rgba(0,0,0,.05)}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;position:relative;cursor:pointer}
nav button.on{color:var(--pt)}
nav .fab{flex:none;width:58px;height:58px;margin:-28px 8px 2px;border-radius:20px;background:linear-gradient(135deg,var(--g),#f3c552);color:#3b2a00;box-shadow:0 10px 22px rgba(224,165,38,.5);justify-content:center}
nav .fab svg{width:28px;height:28px}
.dot{position:absolute;top:0;left:calc(50% + 4px);background:#e11d48;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-style:normal;display:none;align-items:center;justify-content:center;padding:0 5px;font-weight:800}
#drawer{position:fixed;inset:0;z-index:30;visibility:hidden}
.dbk{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:.25s}
#dp{position:absolute;top:0;bottom:0;right:0;width:84%;max-width:330px;background:var(--cd);transform:translateX(100%);transition:.28s;overflow-y:auto}
#drawer.on{visibility:visible}#drawer.on .dbk{opacity:1}#drawer.on #dp{transform:none}
.dh{background:linear-gradient(160deg,var(--p),var(--p2));color:#fff;padding:26px 18px 18px;border-radius:0 0 26px 26px}
.dh .nm{font-size:18px;font-weight:800;margin-top:10px}.dh .lc{opacity:.9;font-size:13px;display:flex;gap:4px;align-items:center}
.stats{display:flex;gap:8px;margin-top:14px}.stats div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 4px;text-align:center;font-size:11px}.stats b{display:block;font-size:17px}
.mi{display:flex;align-items:center;gap:14px;padding:13px 18px;font-weight:700;cursor:pointer;border:0;background:none;width:100%;text-align:right}
.mi:active{background:var(--soft)}.mi svg{color:var(--pt)}.mi .c{margin-right:auto;background:var(--soft);color:var(--pt);border-radius:10px;padding:2px 9px;font-size:12px}
.sep{height:1px;background:var(--bd);margin:6px 18px}
.sw{margin-right:auto;width:46px;height:26px;border-radius:20px;background:var(--bd);position:relative;transition:.2s}.sw:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--p2)}.sw.on:after{right:23px}
#sheet{position:fixed;inset:0;z-index:40;visibility:hidden}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:.25s}
#sheet .pn{position:absolute;bottom:0;left:0;right:0;max-width:720px;margin:auto;background:var(--cd);border-radius:26px 26px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:.28s;max-height:88vh;overflow-y:auto}
#sheet.on{visibility:visible}#sheet.on .bk{opacity:1}#sheet.on .pn{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 14px}
.opt{display:flex;align-items:center;gap:10px;padding:11px;border:1.5px solid var(--bd);border-radius:14px;margin-bottom:8px;cursor:pointer}
.opt input{width:auto;margin:0}
.starsel{display:flex;gap:6px;justify-content:center;margin:12px 0}.starsel button{border:0;background:none;color:var(--bd);padding:2px}.starsel button.on{color:var(--g)}.starsel svg{width:38px;height:38px;fill:currentColor}
.login{background:linear-gradient(170deg,var(--p) 0%,var(--p2) 55%,#0f3d36 100%);min-height:100vh;color:#fff}
.lg{padding:60px 26px 30px;text-align:center;min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:480px;margin:auto}
.lg .big{width:104px;height:104px;border-radius:32px;background:#fff;color:var(--p);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 18px 40px rgba(0,0,0,.3)}.lg .big svg{width:56px;height:56px}
.lg h1{font-size:36px;margin:0 0 6px;font-weight:800}.lg p{margin:0 0 24px;opacity:.92}
.ft{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.12);border-radius:16px;padding:12px 14px;margin-bottom:10px;text-align:right;font-weight:600;font-size:14px}
.gbtn{background:#fff;color:#1f2937;border:0;border-radius:16px;padding:15px;font-weight:800;display:flex;gap:10px;align-items:center;justify-content:center;width:100%;margin-top:18px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.avu{position:relative;display:inline-block;margin-bottom:16px;cursor:pointer}.cam{position:absolute;bottom:0;left:0;width:36px;height:36px;border-radius:50%;background:var(--g);color:#3b2a00;display:grid;place-items:center;border:3px solid var(--cd)}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;scrollbar-width:none;position:relative}.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;max-height:360px;object-fit:cover;scroll-snap-align:center;border-radius:20px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pill{background:var(--soft);color:var(--pt);padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;display:inline-flex;gap:5px;align-items:center}.pill svg{width:14px;height:14px}
.wantbox{background:linear-gradient(135deg,var(--soft),var(--cd));border:1.5px dashed var(--p2);border-radius:16px;padding:12px 14px;margin:12px 0}.wantbox small{color:var(--mu);display:block}.wantbox b{font-size:16px}
.ownc{display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer;margin:12px 0}
.banner{background:#475569;color:#fff;border-radius:14px;padding:11px 14px;font-weight:700;margin:10px 0;display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--soft);border-radius:15px;padding:4px;margin-bottom:14px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;font-weight:700;color:var(--mu)}.seg button.on{background:var(--cd);color:var(--pt);box-shadow:0 3px 10px rgba(0,0,0,.1)}
.ths{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.th{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:var(--soft)}.th img{width:100%;height:100%;object-fit:cover}.th button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;padding:0}.th button svg{width:13px;height:13px}
.th.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--pt);border:2px dashed var(--p2);background:none;cursor:pointer;font-size:11px;font-weight:700}
.li{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:10px;cursor:pointer}.li.un{border-color:#e11d48;background:rgba(225,29,72,.06)}
.li .bd{flex:1;min-width:0}.li .bd b{display:block}.li .bd span{display:block;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{background:#e11d48;color:#fff;border-radius:12px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px}
.chatwrap{position:fixed;top:var(--hh);bottom:0;left:0;right:0;display:flex;flex-direction:column;max-width:720px;margin:auto;background:var(--bg)}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cd);border-bottom:1px solid var(--bd)}.ch .t{flex:1;min-width:0}.ch .t b{display:block}.ch .t span{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column}
.m{max-width:80%;padding:9px 13px;border-radius:18px;margin:3px 0;font-size:15px;word-wrap:break-word;line-height:1.5}
.m small{display:block;font-size:10.5px;opacity:.65;margin-top:2px}
.m.me{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;margin-right:auto;margin-left:0;border-bottom-left-radius:5px}
.m.ot{background:var(--cd);border:1px solid var(--bd);margin-left:auto;margin-right:0;border-bottom-right-radius:5px}
.mimg{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-bottom:4px}video.mimg{width:230px}
.ib2{width:46px;height:46px;border-radius:15px;border:1.5px solid var(--bd);background:var(--cd);display:grid;place-items:center;color:var(--pt);flex:none;padding:0}
.inb{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--cd);border-top:1px solid var(--bd);align-items:center}.inb input{margin:0;border-radius:24px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;flex:none;padding:0}.send svg{transform:scaleX(-1)}
.ph-head{padding:22px 16px;text-align:center}.ph-head .nm{font-size:20px;font-weight:800;margin-top:10px}
.sts{display:flex;gap:10px;margin:16px 0 0}.sts div{flex:1;background:var(--soft);border-radius:16px;padding:10px 4px}.sts b{display:block;font-size:20px;color:var(--pt)}.sts span{font-size:11.5px;color:var(--mu)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.sg button{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh)}.sg svg{color:var(--pt);width:26px;height:26px}
.tip{display:flex;gap:12px;padding:14px;margin-bottom:10px;align-items:flex-start}.tip .n{background:var(--soft);color:var(--pt);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.rv{padding:12px;margin-bottom:8px}.rv .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13.5px}.rv .s svg{width:14px;height:14px;fill:currentColor}
.li .bd span.tag{display:inline-block;color:#fff;font-size:11px}.seg button{font-size:13px;padding:10px 4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tag{display:inline-block;background:#dc2626;color:#fff;border-radius:8px;font-size:11px;padding:1px 8px;font-weight:700;margin-right:6px}
.rrow{display:flex;gap:10px;align-items:center;margin:8px 0;padding:8px;background:var(--soft);border-radius:12px;font-size:13.5px}.rrow img{width:46px;height:46px;border-radius:10px;object-fit:cover}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:600;display:none;z-index:60;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;align-items:center;justify-content:center;padding:10px}
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;background:radial-gradient(120% 90% at 50% 25%,#14594d 0%,#0a3a32 55%,#03171a 100%);transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .art{width:min(78vw,320px);height:auto;filter:drop-shadow(0 16px 30px rgba(0,0,0,.45))}
#splash .c1{animation:fl 3.2s ease-in-out infinite}#splash .c2{animation:fl 3.2s ease-in-out -1.6s infinite}
#splash .ar{transform-origin:160px 120px;animation:sp 3.2s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sp{0%,100%{transform:rotate(0)}50%{transform:rotate(180deg)}}
#splash h1,#splash p{font-family:"Reem Kufi",Cairo,sans-serif}
#splash h1{font-size:46px;margin:22px 0 6px;font-weight:700;letter-spacing:0;background:linear-gradient(180deg,#fff0b3,#e2b043);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash p{margin:4px 0;font-size:20px;font-weight:500;line-height:1.7}
#splash p.s{font-size:15px;opacity:.75;font-weight:400}
#splash .bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:30px;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff0b3,#e2b043);animation:ld 2.4s ease-out forwards}
@keyframes ld{to{width:100%}}
.swp{display:flex;align-items:center;gap:8px;margin:12px 0}.swp>div{flex:1;min-width:0;text-align:center}.swp img,.swp .ph{width:76px;height:76px;border-radius:16px;object-fit:cover;margin:0 auto 6px;display:grid;place-items:center;background:var(--soft);font-size:30px}.swp small{display:block;color:var(--mu);font-size:11.5px}.swp b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ar2{flex:none!important;width:34px!important;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center}.ar2 svg{width:18px;height:18px}
</style>
</head>
<body>
<div id="splash"><svg class="art" viewBox="0 0 320 240" fill="none">

async function compress(f,m=720,q=.62){const i=await loadImg(f),k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");
  c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(i.src);return c.toDataURL("image/jpeg",q);}
async function square(f,sz=240,q=.78){const i=await loadImg(f),s=Math.min(i.width,i.height),c=document.createElement("canvas");
  c.width=c.height=sz;c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,sz,sz);URL.revokeObjectURL(i.src);return c.toDataURL("image/jpeg",q);}

const offSec=o=>o.createdAt?.seconds||Math.floor(Date.now()/1000);

async function pushLocal(o){try{if(!("Notification" in window)||Notification.permission!=="granted"||document.visibilityState==="visible")return;
  const t="🆕 عرض جديد: "+o.title,opt={body:"عاوز يقايض بـ: "+(o.want||"أي حاجة")+(o.gov?" • "+o.gov:""),icon:"icon-192.png",badge:"icon-192.png",tag:"offer-"+o.id,dir:"rtl",lang:"ar"};
  const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();reg?reg.showNotification(t,opt):new Notification(t,opt);}catch{}}
function watchOffers(){
  if(unsubOff){unsubOff();unsubOff=null;}notifOffers=[];offFirst=true;setNb();if(!me)return;
  if(!getSeen())setSeen(Math.floor(Date.now()/1000));

  if(unsubPropIn){unsubPropIn();unsubPropIn=null;}if(unsubPropOut){unsubPropOut();unsubPropOut=null;}

async function loadStats(uid){
  const [os,rs]=await Promise.all([getDocs(query(collection(db,"offers"),where("ownerUid","==",uid))),getDocs(query(collection(db,"ratings"),where("ratedUid","==",uid)))]);
  const offers=os.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const reviews=rs.docs.map(d=>d.data()).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0));
  const avg=reviews.length?reviews.reduce((a,r)=>a+r.stars,0)/reviews.length:0;
  return {offers,open:offers.filter(o=>o.status!=="done"&&o.status!=="hidden").length,done:offers.filter(o=>o.status==="done").length,avg,count:reviews.length,reviews};
}

    a.innerHTML+=`<button class="btn red" id="dl">${ic("trash")} حذف العرض</button>`;

    $("#dl").onclick=async()=>{if(await confirmSheet("متأكد إنك عاوز تحذف العرض نهائياً؟","حذف",true)){await deleteDoc(doc(db,"offers",id));toast("اتحذف");go("mine",null,"replace");}};

async function markSwapped(o){
  let chats=[];try{const s=await getDocs(query(collection(db,"chats"),where("participants","array-contains",me.uid)));chats=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.offerId===o.id);}catch{}

  sheet(`<h3>اتقايضت مع مين؟</h3>${items.map((x,i)=>`<label class="opt"><input type="radio" name="sw" value="${i}" ${i===0?"checked":""}>${avatar(x.photo,x.name,34)}<b>${esc(x.name)}</b></label>`).join("")}

function rateSheet(uid,name,cid){let v=0;
  sheet(`<h3 class="ctr">قيّم ${esc(name)}</h3><div class="starsel" id="ss">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${ic("star")}</button>`).join("")}</div>

async function chatsView(){
  if(curView!=="chats")return;
  try{const s=await getDocs(query(collection(db,"chats"),where("participants","array-contains",me.uid)));
    const r=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.lastAt).sort((a,b)=>(b.lastAt?.seconds||0)-(a.lastAt?.seconds||0));

async function chatView(cid){
  const cs=await getDoc(doc(db,"chats",cid));if(!cs.exists()){view.innerHTML=emptyBox("chat","المحادثة مش موجودة");return;}
  const c=cs.data(),other=c.participants.find(p=>p!==me.uid);if(isUnread(c))markRead(cid);
  $("#ht").textContent=c.names?.[other]||"المحادثة";
  view.innerHTML=`<div class="chatwrap"><div class="ch" id="chh">${avatar(c.photos?.[other],c.names?.[other],40)}<div class="t"><b>${esc(c.names?.[other]||"مستخدم")}</b><span>${esc(c.offerTitle)}</span></div><button class="btn sec sm" id="rt">${ic("star")} قيّم</button></div>
  <div class="msgs" id="ms"></div><div class="inb"><button class="ib2" id="at" aria-label="مرفق">${ic("clip")}</button><input id="mi" placeholder="اكتب رسالة..." autocomplete="off"><button class="send" id="sd" aria-label="إرسال">${ic("send")}</button></div><input type="file" id="fi" accept="image/*,video/*" hidden></div>`;
  $("#chh .t").onclick=()=>go("offer",c.offerId);$("#chh").firstElementChild.onclick=()=>go("user",other);
  unsub=onSnapshot(query(collection(db,"chats",cid,"messages"),orderBy("at")),s=>{
    const box=$("#ms");if(!box)return;
    box.innerHTML=s.docs.map(d=>{const m=d.data();let b="";
      if(safeImg(m.img))b+=`<img class="mimg" src="${esc(safeImg(m.img))}" alt="">`;
      if(typeof m.video==="string"&&m.video.startsWith("https://"))b+=`<video class="mimg" src="${esc(m.video)}" controls playsinline preload="metadata"></video>`;
      if(m.text)b+=esc(m.text);return `<div class="m ${m.from===me.uid?"me":"ot"}">${b}<small>${hm(m.at)}</small></div>`;}).join("");
    box.querySelectorAll("img.mimg").forEach(i=>i.onclick=()=>{const o=$("#ov");o.innerHTML=`<img src="${i.src}" style="max-width:100%;max-height:100%">`;o.style.display="flex";o.onclick=()=>{o.style.display="none";o.innerHTML="";};});
    box.scrollTop=box.scrollHeight;const last=s.docs[s.docs.length-1]?.data();
    if(last&&last.from!==me.uid&&!s.metadata.hasPendingWrites)markRead(cid);});
  const post=async(data,preview)=>{await addDoc(collection(db,"chats",cid,"messages"),{...data,from:me.uid,at:serverTimestamp()});
    await updateDoc(doc(db,"chats",cid),{lastMsg:preview,lastAt:serverTimestamp(),lastFrom:me.uid,["unread."+other]:increment(1)});};
  const send=async()=>{const t=$("#mi").value.trim();if(!t)return;$("#mi").value="";try{await post({text:t},t);}catch(e){toast("فشل الإرسال");}};
  $("#sd").onclick=send;$("#mi").onkeydown=e=>{if(e.key==="Enter")send();};
  $("#rt").onclick=()=>rateSheet(other,c.names?.[other]||"المستخدم",cid);
  $("#at").onclick=()=>$("#fi").click();
  $("#fi").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
    try{
      if(f.type.startsWith("image/")){toast("جاري إرسال الصورة...");let img=await compress(f,900,.65);if(img.length>900000)img=await compress(f,600,.5);await post({img},"📷 صورة");}
      else if(f.type.startsWith("video/")){if(!CLOUD_NAME||!UPLOAD_PRESET)return toast("إرسال الفيديو لسه محتاج إعداد Cloudinary");
        if(f.size>50*1024*1024)return toast("الفيديو أكبر من 50MB");toast("جاري رفع الفيديو... ⏳");await post({video:await uploadVideo(f)},"🎥 فيديو");}
      else toast("نوع الملف غير مدعوم");
    }catch(err){toast("فشل الإرسال: "+(err.message||err));}};
}

  ${st.reviews.length?`<h3 style="margin:20px 2px 10px">التقييمات</h3>${st.reviews.slice(0,8).map(r=>`<div class="card rv"><div class="h"><span>${esc(r.raterName||"مستخدم")}</span><span class="s gold">${starsHTML(r.stars)}</span></div>${r.comment?`<div class="mu" style="margin-top:6px">${esc(r.comment)}</div>`:""}</div>`).join("")}`:""}`;
  bindCards($("#list"));
}
function profileForm(setup){
  const p=prof||{};let photo=p.photo||(setup?me.photoURL:"")||"";
  view.innerHTML=`<div class="card pad ctr">${setup?`<p class="mu" style="margin-top:0">كمّل بياناتك عشان الناس تثق فيك وتتعامل معاك بأمان.</p>`:""}
  <label class="avu"><span id="avw">${avatar(photo,p.name||me.displayName,108)}</span><span class="cam">${ic("camera")}</span><input type="file" id="pf" accept="image/*" hidden></label>
  <div class="fld"><label>الاسم الكامل *</label><input id="nm" maxlength="40" value="${esc(p.name||me.displayName||"")}" placeholder="اسمك الحقيقي"></div>
  <div class="fld"><label>المحافظة *</label><select id="gv">${opts(GOVS,"اختر المحافظة",p.gov)}</select></div>
  <div class="fld"><label>المدينة / المنطقة *</label><input id="ct" maxlength="40" value="${esc(p.city||"")}" placeholder="مثال: المنصورة - حي الجامعة"></div>
  <div class="fld"><label>نبذة عنك (اختياري)</label><textarea id="bio" maxlength="120" style="min-height:70px">${esc(p.bio||"")}</textarea></div>
  <p class="mu sm">${ic("lock")} بيظهر للناس: الاسم والصورة والمحافظة والمدينة بس. إيميلك ورقمك مش بيظهروا.</p>
  <button class="btn" id="sv">${setup?"ابدأ المقايضة 🎉":"حفظ التغييرات"}</button></div>`;
  $("#pf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await square(f);$("#avw").innerHTML=avatar(photo,"",108);}catch{toast("تعذر قراءة الصورة");}};
  $("#sv").onclick=async()=>{const d={name:$("#nm").value.trim(),gov:$("#gv").value,city:$("#ct").value.trim(),bio:$("#bio").value.trim(),photo};
    if(d.name.length<3)return toast("اكتب اسمك الكامل (3 حروف على الأقل)");
    if(!d.photo)return toast("ضيف صورتك الشخصية");
    if(!d.gov)return toast("اختر المحافظة");
    if(d.city.length<2)return toast("اكتب المدينة أو المنطقة");
    $("#sv").disabled=true;
    try{const payload={...d,complete:true,updatedAt:serverTimestamp()};if(setup){payload.createdAt=serverTimestamp();payload.favs=[];}
      await setDoc(doc(db,"users",me.uid),payload,{merge:true});prof={...(prof||{}),...d,complete:true,favs:prof?.favs||[]};
      toast(setup?"أهلاً بيك في مقايضة! 🎉":"اتحفظت بياناتك ✅");go(setup?"home":"me",null,"replace");
    }catch(e){toast("فشل الحفظ: "+(e.code||e.message));$("#sv").disabled=false;}};
}

/* admin */
async function setBan(uid,ban){
  await updateDoc(doc(db,"users",uid),{banned:ban,bannedAt:ban?serverTimestamp():null});
  const os=await getDocs(query(collection(db,"offers"),where("ownerUid","==",uid)));
  for(const d of os.docs){const st=d.data().status;
    if(ban&&st!=="done"&&st!=="hidden")await updateDoc(d.ref||doc(db,"offers",d.id),{status:"hidden"});
    if(!ban&&st==="hidden")await updateDoc(d.ref||doc(db,"offers",d.id),{status:"open"});}
}
async function adminView(tab="new"){
  if(!isAdm){view.innerHTML=emptyBox("lock","غير مصرح لك");return;}
  view.innerHTML=loader;
  const rs=await getDocs(query(collection(db,"reports"),orderBy("at","desc"),limit(100)));
  const reps=rs.docs.map(d=>({id:d.id,...d.data()}));
  const us=await getDocs(query(collection(db,"users"),limit(300)));
  const um={};us.docs.forEach(d=>um[d.id]=d.data());
  const om={};await Promise.all([...new Set(reps.map(r=>r.offerId))].map(id=>getDoc(doc(db,"offers",id)).then(s=>{if(s.exists())om[id]=s.data();}).catch(()=>{})));
  const nw=reps.filter(r=>!r.reviewed),dn=reps.filter(r=>r.reviewed);pendingReports=nw.length;
  const nm=u=>esc(um[u]?.name||"مستخدم");
  const repCard=r=>{const o=om[r.offerId],ow=um[r.ownerUid]||{},ph=o&&(o.photos?.[0]||o.photo);
    return `<div class="card pad" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><b>${esc(r.reason)}</b><span class="mu sm">${ago(r.at)}</span></div>
    ${r.note?`<p class="mu" style="margin:6px 0">${esc(r.note)}</p>`:""}
    <div class="rrow">${safeImg(ph)?`<img src="${esc(safeImg(ph))}" alt="">`:""}<div style="flex:1;min-width:0"><b>${o?esc(o.title):"العرض محذوف"}</b><div class="mu sm">صاحبه: ${nm(r.ownerUid)}${ow.banned?'<span class="tag">موقوف</span>':""}</div></div></div>
    <div class="mu sm">المبلّغ: ${nm(r.reporterUid)}</div>
    <div class="acts">${o?`<button class="btn sec sm" data-a="view" data-o="${r.offerId}">عرض</button><button class="btn red sm" data-a="del" data-o="${r.offerId}" data-r="${r.id}">حذف العرض</button>`:""}
    ${r.ownerUid===me.uid?"":`<button class="btn ${ow.banned?"sec":"red"} sm" data-a="ban" data-u="${r.ownerUid}">${ow.banned?"فك الحظر":"حظر صاحبه"}</button>`}
    ${r.reviewed?`<button class="btn sec sm" data-a="rm" data-r="${r.id}">حذف البلاغ</button>`:`<button class="btn sm" data-a="ok" data-r="${r.id}">تمت المراجعة</button>`}</div></div>`;};
  const userRow=([id,u])=>`<div class="card li" style="cursor:default">${avatar(u.photo,u.name,46)}<div class="bd"><b>${esc(u.name||"")}${u.banned?'<span class="tag">موقوف</span>':""}</b><span>${esc(where_(u))}</span></div>${id===me.uid?'<span class="tag" style="background:var(--p);color:#fff">أنت</span>':`<button class="btn ${u.banned?"sec":"red"} sm" data-a="ban" data-u="${id}">${u.banned?"فك الحظر":"حظر"}</button>`}</div>`;
  const draw=t=>{
    view.innerHTML=`<div class="seg"><button data-t="new" class="${t==="new"?"on":""}">جديدة (${nw.length})</button><button data-t="done" class="${t==="done"?"on":""}">تمت (${dn.length})</button><button data-t="users" class="${t==="users"?"on":""}">المستخدمين (${us.docs.length})</button></div>
    <div id="al">${t==="users"?Object.entries(um).sort((a,b)=>(b[1].createdAt?.seconds||0)-(a[1].createdAt?.seconds||0)).map(userRow).join("")||emptyBox("user","مفيش مستخدمين"):(t==="new"?nw:dn).map(repCard).join("")||emptyBox("check",t==="new"?"مفيش بلاغات جديدة":"مفيش بلاغات سابقة")}</div>`;
    view.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>draw(b.dataset.t));
    $("#al").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
      try{
        if(a==="view")return go("offer",b.dataset.o);
        if(a==="ok"){await updateDoc(doc(db,"reports",b.dataset.r),{reviewed:true,reviewedAt:serverTimestamp()});}
        if(a==="rm"){await deleteDoc(doc(db,"reports",b.dataset.r));}
        if(a==="del"){if(!await confirmSheet("حذف العرض نهائياً؟","حذف",true))return;await deleteDoc(doc(db,"offers",b.dataset.o));await updateDoc(doc(db,"reports",b.dataset.r),{reviewed:true,reviewedAt:serverTimestamp()});toast("اتحذف العرض");}
        if(a==="ban"){const u=b.dataset.u,cur=!!um[u]?.banned;if(u===me.uid)return toast("مينفعش تحظر نفسك");
          if(!await confirmSheet(cur?"فك الحظر عن المستخدم؟":"حظر المستخدم؟ هيتخفى عروضه ومش هيقدر يستخدم التطبيق.",cur?"فك الحظر":"حظر",!cur))return;
          await setBan(u,!cur);toast(cur?"اتفك الحظر":"اتحظر المستخدم");}
        adminView(t);
      }catch(err){toast("فشل: "+(err.code||err.message));}};};
  draw(tab);
}
